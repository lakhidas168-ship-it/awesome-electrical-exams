# The downloadable offline copy of the website (opens from disk, no internet), built by pages.yml.
INHERIT: mkdocs.yml
site_dir: site-offline
use_directory_urls: false

theme:
  name: material
  font: false
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - offline
