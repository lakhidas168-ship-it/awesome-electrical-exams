# Hive-wide settings. Changes here change how the whole hive spends its time: owner or an approved OpenCode task only.

[focus.ramp]
# Share of runs for the "india" focus (every exam family except the engineering track). It is never fixed:
# it starts at 20% and grows by 1 point for every 5 india tasks published, as long as at least 80% of judged
# india work was approved. If quality drops, it falls back to the start until it recovers. Capped at 60% so the
# engineering track (the owner's own exams) always keeps at least 40%.
# If the chosen focus has no ready task, the lane takes a task from the other focus instead of idling.
start = 0.20
step = 0.01
per_published = 5
min_acceptance = 0.8
max = 0.60

[lane_offset]
# Shifts each lane's rotation so the lanes don't all switch to "india" in the same hour.
hermes = 0
opencode = 2
jevx = 0

[free_agent]
# Zero-cost agent used when a lane's command is "free-agent" (ops/free_agent.py).
# Providers are tried in order; one without a key, or rate-limited, is skipped.
providers = ["github", "gemini", "openrouter", "groq", "opencode-go", "ollama"]
max_steps = 14
# Free tiers cap tokens per request (GitHub Models: about 8k in / 4k out), so the agent keeps its context under this.
context_chars = 22000

[free_agent.lane_providers]
# The owner's paid OpenCode Go plan (DeepSeek V4.1 Flash) goes where quality matters most: tooling and judging.
# Content work runs on free tiers first and uses OpenCode Go only as a fallback.
hermes = ["github", "gemini", "openrouter", "groq", "opencode-go", "ollama"]
opencode = ["opencode-go", "github", "gemini", "openrouter", "groq", "ollama"]
jevx = ["opencode-go", "github", "gemini", "openrouter", "groq", "ollama"]

[free_agent.models]
opencode-go = ["deepseek-v4.1-flash", "deepseek-v4-flash"]
github = ["openai/gpt-4.1-mini", "openai/gpt-4o-mini"]
gemini = ["gemini-flash-latest", "gemini-3-flash-preview"]   # 2.5-flash retired (404, 2026-09-27)
openrouter = ["nvidia/nemotron-3-super-120b-a12b:free", "nvidia/nemotron-3-ultra-550b-a55b:free"]   # old :free ids 404 (2026-09-27)
groq = ["llama-3.3-70b-versatile"]
ollama = ["qwen2.5:7b-instruct"]
