# Hive backlog.
# Single writer: the JEVX lane. Worker lanes (hermes, opencode) never edit this file.
# The "human" lane is the owner's checklist: agents never pick those tasks.
#
# priority: 1 = most urgent.  deps: ids that must be done first.  blocked = true parks a task.
# focus: "core" (engineering track, ~80% of runs) or "india" (all other exams, ~20%); see ops/hive.toml.
# DONE    = ops/done/<id>.md exists on main (a receipt that landed).
# CLAIMED = refs/heads/claim/<id> or a branch agent/<lane>/<id> exists on the remote.
#
# where: "any" (default), "mac" (needs the owner's machine: local files or local tools) or "cloud".
# Id ranges: H- owner · T-0xx hermes core · T-1xx opencode · T-2xx hermes exam pages · T-4xx hermes modules ·
#            T-5xx harvest of the owner's earlier local work (where = "mac", added by JEVX from ops/harvest.py tasks).

