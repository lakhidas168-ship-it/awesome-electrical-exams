[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air10-exam"
version = "0.1.0"
description = "One MCP for all Electrical Engineering competitive exams in India (GATE EE, UPSC ESE, SSC JE, RRB JE, State AE/JE, PSUs)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rajon Das"}]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sympy>=1.12.0",
    "pandas>=2.1.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
solvers = [
    "lcapy>=0.90.0",
    "control>=0.9.4",
    "pandapower>=3.0.0",
]
ml = [
    "flashrank>=0.1.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
air10-exam = "air10_exam:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true